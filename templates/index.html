<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellion Studio QR Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.5.0/dist/easy.qrcode.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="hero-header py-4 px-4 mb-4">
        <div class="d-flex justify-content-end align-items-center mb-2">
            <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="toggleDarkMode()">
                <i class="bi bi-moon-stars-fill me-1"></i> Mode Tampilan
            </button>
        </div>
        <div class="text-center pb-3">
            <h2 class="fw-bold mb-1 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-qr-code-scan fs-3"></i> Cellion Studio QR Generator
            </h2>
            <p class="mb-0 opacity-75 small">Buat QR Code dari URL atau teks dan sesuaikan tampilannya</p>
        </div>
    </header>

    <main class="container-fluid px-4 pb-5">
        <div class="row g-4 align-items-start">
            <section class="col-lg-7 col-xl-7" aria-label="Form QR Code">
                <div class="card card-custom p-4">
                    <form action="{{ url_for('index') }}" method="POST" enctype="multipart/form-data">
                        <div class="mb-4">
                            <label for="text_data" class="form-label fw-bold small">URL / Teks Tujuan</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-globe"></i></span>
                                <input type="text" class="form-control" id="text_data" name="text_data"
                                       placeholder="https://domainanda.com atau masukkan teks" oninput="renderRealtimeQR()" required>
                            </div>
                        </div>

                        <hr class="my-4">
                        <small class="text-uppercase fw-bold text-muted mb-3 d-block"><i class="bi bi-palette-fill me-1"></i> Kustomisasi Tampilan</small>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="dark_color" class="form-label fw-bold small">Warna Utama (Dots)</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="color" class="form-control form-control-color" id="dark_color" name="dark_color" value="#000000" oninput="renderRealtimeQR()">
                                    <span id="dark_color_val" class="small text-muted font-monospace">#000000</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="light_color" class="form-label fw-bold small">Warna Latar (BG)</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="color" class="form-control form-control-color" id="light_color" name="light_color" value="#ffffff" oninput="renderRealtimeQR()">
                                    <span id="light_color_val" class="small text-muted font-monospace">#FFFFFF</span>
                                </div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="logo" class="form-label fw-bold small">Logo Tengah (Opsional)</label>
                                <input type="file" class="form-control form-control-sm" id="logo" name="logo" accept="image/*">
                            </div>
                            <div class="col-md-6">
                                <label for="file_format" class="form-label fw-bold small">Format Unduhan File</label>
                                <select class="form-select form-select-sm" id="file_format" name="file_format">
                                    <option value="png" {% if file_format == 'png' %}selected{% endif %}>PNG (High Resolution)</option>
                                    <option value="jpg" {% if file_format == 'jpg' %}selected{% endif %}>JPG</option>
                                    <option value="svg" {% if file_format == 'svg' %}selected{% endif %}>SVG (Vector)</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gradient btn-lg w-100 py-3 shadow-sm">
                            <i class="bi bi-qr-code me-2"></i>Generate &amp; Simpan QR Code
                        </button>
                    </form>
                </div>
            </section>

            <aside class="col-lg-5 col-xl-5" aria-label="Pratinjau QR Code">
                <div class="card card-custom p-4 text-center live-preview-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold small text-secondary"><i class="bi bi-eye-fill me-1 text-primary"></i>Live Preview</span>
                        <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2 py-1 small">
                            <i class="bi bi-dot"></i> Real-time
                        </span>
                    </div>
                    <div class="qr-stage mb-3"><div id="canvasPreview" class="d-flex justify-content-center"></div></div>
                    <p class="text-muted extra-small mb-0"><i class="bi bi-shield-check me-1"></i>Pratinjau langsung sebelum diunduh.</p>
                    {% if qr_filename %}
                    <div class="alert alert-success rounded-3 p-3 text-start mt-4 mb-0">
                        <div class="fw-bold mb-1"><i class="bi bi-check-circle-fill me-1"></i>QR Berhasil Dibuat!</div>
                        <a href="{{ url_for('download_file', fmt=file_format) }}" class="btn btn-success btn-sm w-100 mt-2">
                            <i class="bi bi-download me-1"></i>Download {{ file_format|upper }}
                        </a>
                    </div>
                    {% endif %}
                </div>
            </aside>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
